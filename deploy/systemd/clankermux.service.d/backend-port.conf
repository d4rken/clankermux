# /etc/systemd/system/clankermux.service.d/backend-port.conf
# Move the app behind the Caddy front proxy (deploy/caddy/): the app binds
# 127.0.0.1:8090 while Caddy owns the client-facing :8080, holding new
# connections during app restarts so clients never see ECONNREFUSED. The
# client-facing port stays :8080 — only the process behind it changes.
# Binding to loopback narrows who can open a connection to THIS port: local
# processes still reach 127.0.0.1:8090 directly, everything else has to arrive
# through the front proxy. It does not take the dashboard/API off the LAN —
# what the network can reach is decided by whatever listens on :8080, which
# proxies this port as a whole — and it is not an access control. The
# management operations (accounts, client keys, request logs) are gated by the
# app's own login once an operator has set a management password, and /wire/*
# agent traffic by a per-client API key. It does silence the app's own startup
# network-exposure warning.
# ⚠️ ONLY apply this drop-in together with the Caddy front proxy — with the
# app on loopback:8090 and no Caddy on :8080, clients reach nothing.
[Service]
Environment=PORT=8090
# NOTE: the bind host is read via readEnv("HOST") in packages/core/src/env.ts,
# which only checks the prefixed form (CLANKERMUX_HOST) — a bare HOST= is
# silently ignored and the app binds 0.0.0.0.
Environment=CLANKERMUX_HOST=127.0.0.1
