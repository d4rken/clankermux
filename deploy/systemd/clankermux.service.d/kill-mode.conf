# /etc/systemd/system/clankermux.service.d/kill-mode.conf
# On stop, signal only the server. The default (control-group) sends SIGTERM to
# every process in the unit at once, which kills each SDK-bridge turn's Claude
# Code child the moment a restart begins, while the server itself is still
# draining those turns. With mixed, the server drains and disposes the bridge
# itself; anything still left in the cgroup is SIGKILLed after it exits.
[Service]
KillMode=mixed
