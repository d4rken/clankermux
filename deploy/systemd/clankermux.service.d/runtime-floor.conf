# /etc/systemd/system/clankermux.service.d/runtime-floor.conf
# The proxy refuses to start on a Bun below the floor declared in
# `.bun-version` / `engines.bun` (packages/core/src/bun-runtime-floor.ts): on
# older runtimes a client aborting a streaming response segfaults the process
# natively (oven-sh/bun#32111, fixed by #32120 and shipped in Bun 1.4.0).
#
# That refusal exits 78 (EX_CONFIG, "configuration error"). The base unit's
# rate limiter would stop the retries after five attempts, but
# restart-backoff.conf in this same directory sets StartLimitIntervalSec=0, so
# there is no limit left: without this drop-in, Restart=always retries a
# sub-floor Bun forever at RestartSec=30, filling the journal with the same
# message and leaving Caddy holding client connections for up to
# lb_try_duration each round. Suppressing restarts for exactly that status
# turns it into one clean, legible failure. The suppression matters more
# alongside restart-backoff.conf, not less: nothing else stops the loop.
#
# 78 is used by no other exit path in the app, so this cannot mask a crash: a
# segfault, an OOM kill or a generic startup error all still restart normally.
#
# Recovery is to fix the runtime, not to bypass the gate: upgrade Bun and check
# with `bun --revision` that the binary named in ExecStart= is the upgraded one
# (a `bun` earlier on PATH is not necessarily the one systemd launches).
[Service]
RestartPreventExitStatus=78
