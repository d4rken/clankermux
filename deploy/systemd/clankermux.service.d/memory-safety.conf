# /etc/systemd/system/clankermux.service.d/memory-safety.conf
# Memory safety valve (added 2026-05-27).
#
# Root cause of the 2026-05-26 box-wide swap thrash: the proxy's anonymous
# memory (unbounded ReadableStream.tee() client-branch buffering in the
# streaming response path) grew to ~2 GB. With MemoryHigh=2G the kernel
# reclaimed by swapping the proxy's in-use anonymous pages (~1.6 GB swap),
# thrashing the whole box.
#
# Until the tee() buffering is fixed in code, this valve:
#   - MemorySwapMax=0  : forbid this service from using swap, so a memory
#                        runaway is OOM-killed and cleanly restarted
#                        (Restart=always) instead of dragging the box into
#                        swap thrash. The actual fix for the box-wide symptom.
#   - MemoryHigh=3G    : move the soft throttle off the 2 G failure point so the
#                        proxy is not reclaimed while still operating normally.
#   - MemoryMax=4G     : unchanged hard ceiling; kill+restart a true runaway.
[Service]
MemoryHigh=4G
MemoryMax=6G
MemorySwapMax=2G
