# /etc/systemd/system/clankermux.service.d/restart-backoff.conf
# Self-healing restart policy (added 2026-07-28).
#
# Incident: the host disk filled to 0 bytes. An unguarded write in the log file
# writer crashed the proxy (fixed in code, v2026.7.40 — the stream had no
# 'error' listener, and an unhandled stream 'error' terminates the process).
# systemd restarted it 6 times inside ~60s, hit the DEFAULT StartLimitBurst=5
# within the default 10s StartLimitIntervalSec, and gave up. The unit then sat
# DEAD for ~8.5 minutes until it was started by hand — long after the crash
# loop itself had stopped, and long after the only thing needed was free space.
#
# The trigger for that outage was external and self-clearing. "Give up and stay
# down" is the wrong default for it: a proxy that never returns once the cause
# clears is a worse outcome than one that keeps retrying cheaply.
#
#   RestartSec=30            : back off between attempts. Even a permanent
#                              crash loop then costs ~2 starts/min instead of
#                              hammering the ExecStartPre chain (verify-deps +
#                              the two guarded builds) as fast as it can.
#   StartLimitIntervalSec=0  : never stop retrying. Combined with the 30s
#                              backoff the cost of a hopeless loop is trivial,
#                              and the unit recovers on its own the moment the
#                              underlying cause is fixed — no manual start.
#
# Trade-off, stated explicitly: with the rate limiter disabled the unit will
# never enter `failed` state on repeated start failures, so a genuinely broken
# deploy loops quietly instead of stopping. `systemctl status` and the journal
# still show it; there is no other alarm. Accepted because the failure mode
# this replaces (silently staying down after a transient, self-clearing fault)
# is both more likely here and harder to notice.
[Unit]
StartLimitIntervalSec=0

[Service]
RestartSec=30
