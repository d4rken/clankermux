name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"

jobs:
  lint:
    name: Lint & format (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # `biome ci` is the read-only counterpart to the local `bun run lint`
      # (which uses --write --unsafe). It checks formatting + lint rules and
      # fails on errors without mutating any files.
      - run: bunx --bun biome ci .

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # No inline-worker placeholder step here on purpose: the committed
      # `inline-*-worker.d.ts` stubs already resolve those imports for tsc.
      # Writing .ts placeholders would only mask a stub someone forgot to add.
      # apps/server imports the gitignored dashboard build artifacts
      # (dist/embedded.ts, dist/manifest.json); generate them (~1s).
      - run: bun run build:dashboard
      - run: bun run typecheck

  test:
    name: Unit tests (bun test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Unlike tsc, `bun test` loads the real modules, so the gitignored inline
      # worker files must exist or whole test files fail to collect. Empty
      # placeholders suffice (no test executes a worker bundle) and skip the
      # bundling. The list comes from the worker manifest, so a newly added
      # worker cannot be missed here.
      - run: bun packages/database/scripts/build-workers.ts --placeholders-only
      # The --serve CLI test boots the server, which imports the dashboard
      # build artifacts; without them that test hangs to timeout.
      - run: bun run build:dashboard
      - run: bun test
      # Separate lane, separate process: happy-dom's globals are process-wide
      # (they replace fetch/Request/Response/URL among others) and must not be
      # installed for the proxy suite, so the DOM tests cannot share the run
      # above. Needs no extra setup beyond the steps already run for `bun test`.
      - run: bun run test:dom

  audit:
    name: Dependency audit (bun audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Exact-pinned deps never auto-update, so a published advisory would
      # otherwise sit silently. Fail the build on high/critical vulns; lower
      # severities are tracked by Dependabot (.github/dependabot.yml).
      - run: bun audit --audit-level=high
