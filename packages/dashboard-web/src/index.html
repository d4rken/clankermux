<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <title>ClankerMux Dashboard</title>
    <!--
      Resolve the colour mode before React mounts so the first paint is already
      correct. Without this the app flashes light for a frame on every load for
      anyone on a dark OS. Mirrors readStoredTheme() in
      contexts/theme-context.tsx.
    -->
    <script>
      (() => {
        const root = document.documentElement;
        // "system" is the provider's default for a missing, invalid or
        // unreadable value, so it has to be the default here too.
        let theme = "system";
        try {
          const stored = localStorage.getItem("theme");
          if (stored === "dark" || stored === "light" || stored === "system") {
            theme = stored;
          }
        } catch (_e) {
          // Storage throws outright when site data is blocked; the default
          // already assigned above is the correct fallback.
        }
        const dark =
          theme === "dark" ||
          (theme === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        root.classList.add(dark ? "dark" : "light");
      })();
    </script>
    <!--
      Geist and Geist Mono: one sans and the mono drawn alongside it. Loaded
      from Google Fonts with real fallback stacks, so the dashboard degrades to
      system faces rather than breaking when offline.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
    />
    <script type="module" src="./frontend.tsx" async></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
