<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#0F1A20" stroke-linecap="round" stroke-linejoin="round">
  <!--
    Favicon twin of components/BrandMark.tsx. Same geometry, but a literal
    colour rather than currentColor: a favicon is rendered by the browser
    chrome, outside any document that could supply one.

    The ink flips with the OS scheme so the mark stays visible on both a light
    and a dark browser tab strip. Media queries inside an SVG referenced by
    <link rel="icon"> are honoured by Firefox and Safari; Chrome ignores them
    and paints the light-mode ink, which still reads on its tab bar.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      path, rect { stroke: #E8EFF1; }
    }
  </style>
  <path d="M2 12h7M2 19.5h2.5C7 19.5 6.5 15 9 15M15 9c2.5 0 2-4.5 4.5-4.5H22M15 12h7" stroke-width="1.35"/>
  <rect x="8.75" y="8" width="6.5" height="8" rx="1.5" stroke-width="1.6"/>
  <path d="M2 4.5h2.5C7 4.5 6.5 9 9 9l6 6c2.5 0 2 4.5 4.5 4.5H22" stroke-width="2.4"/>
</svg>
